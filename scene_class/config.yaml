paths:
    base_path:          "/mnt/data1/PAI_diptera"
    data_path:          "/mnt/data1/PAI_diptera/image_data_filtered"
    original_data_path: "/mnt/data1/PAI_diptera/image_data"
    prediction_path:    "/mnt/ushelf_star_th/projects/2023_PAI/2023_PAI_diptera/PAI_diptera" # depends on parameters below
    model_path:         "/mnt/ushelf_star_th/projects/2023_PAI/2023_PAI_diptera/PAI_diptera" # depends on parameters below
    results_path: "/mnt/ushelf_star_th/projects/2023_PAI/2023_PAI_diptera/PAI_diptera" # !!! Under results_path must be a folder named "models" and "predictions"
    images_stats_path: "/mnt/ushelf_star_th/data/PAI_diptera/image_stats.csv"
parameters:
    model: seresnext26d_32x4d #vit_base_patch16_224  #efficientnet_b4  # resnet18  # efficientnet_b3  #   # stnet
    pretrained: True
    dropout: 0.5
    test_time_iterations: 100
    test_time_dropout: True
    test_time_augmentation: True
    bit_depth: 8
    epochs: 100
    image_size: 512  # 512 # only select image sizes devisible by 32
    learningrate: 0.001
    learningrate_sheduler: 'CosineAnnealingWarmRestarts' #'CosineAnnealingWarmRestarts'  # 'cosine'
    normalization: imagenet  # znorm
    num_classes: 15
    batch_size: 8
    optimizer: 'adam'
    verbose: 0 # verbose 0,1,2 or 3
    save_inference_images: True
    seed: 42
